name: Release

# Builds the one-binary artifacts (embedded WebUI) for Windows x64 and Linux
# x64, publishes a GitHub release on `v*` tags, and pushes a GHCR image for
# the same tags.
#
# Run manually via "Run workflow" to produce build artifacts only.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release and upload assets
  packages: write # push the GHCR container image
  actions: read # download build artifacts from this run

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: agpeer-x64-windows
            ext: .exe
          - os: ubuntu-latest
            artifact: agpeer-x64-linux
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build WebUI dist
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build one-binary release
        run: cargo build --release --features webui --bin agpeer

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "target/release/agpeer${{ matrix.ext }}" staging/
          cp deploy/config.example.toml staging/agpeer.example.toml
          cp THIRD_PARTY_NOTICES.md staging/
          cp LICENSE staging/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/*

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          # Only the build matrix artifacts; docker/build-push-action also
          # uploads a *.dockerbuild build record that must not reach releases.
          pattern: agpeer-*
          merge-multiple: true
          path: staging

      - name: Checksums and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd staging && sha256sum -- * > SHA256SUMS)
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "agpeer $TAG"
          fi
          # One uploader runs after both matrix build jobs finish, so no
          # concurrent write races the release.
          gh release upload "$TAG" staging/* --clobber

  docker:
    name: Publish container image
    runs-on: ubuntu-latest
    # Tags only: a manual dispatch must never overwrite `:latest` with an
    # unreviewed branch build.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image base (GHCR names must be lowercase)
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agpeer" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          # Keep buildx from uploading a *.dockerbuild record artifact.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:latest
            ${{ env.IMAGE_BASE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max