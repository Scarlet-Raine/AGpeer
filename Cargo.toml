[package]
name = "agpeer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/agpeer/agpeer"
description = "agpeer core service binary (serve + migrate)."

[[bin]]
name = "agpeer"
path = "src/main.rs"

[features]
# Real BitTorrent transfers via librqbit. On by default so `cargo build` gives
# a fully functional binary; disable with --no-default-features for a lighter
# build (falls back to the in-memory reference engine).
default = ["rqbit"]
rqbit = ["agpeer-torrent/rqbit"]

[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/storage",
    "crates/core",
    "crates/api",
    "crates/torrent",
    "crates/soulseek",
    "crates/hook",
    "crates/jobs",
    "crates/postprocess",
    "crates/mcp",
    "crates/debug-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/agpeer/agpeer"

[workspace.dependencies]
# serialization / time / ids
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"

# runtime / networking
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "fs", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
futures = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
axum = { version = "0.8", features = ["macros", "tokio"] }

# persistence
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI / config
clap = { version = "4", features = ["derive"] }
directories = "6"

# secrets
keyring = "3"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# internal crates
agpeer-common = { path = "crates/common" }
agpeer-storage = { path = "crates/storage" }
agpeer-core = { path = "crates/core" }
agpeer-api = { path = "crates/api" }
agpeer-torrent = { path = "crates/torrent" }
agpeer-soulseek = { path = "crates/soulseek" }
agpeer-hook = { path = "crates/hook" }
agpeer-jobs = { path = "crates/jobs" }
agpeer-postprocess = { path = "crates/postprocess" }
rustsoseek = { git = "https://github.com/Scarlet-Raine/RustSoSeek", tag = "v0.1.0" }

[dependencies]
agpeer-common.workspace = true
agpeer-storage.workspace = true
agpeer-core.workspace = true
agpeer-api.workspace = true
agpeer-torrent.workspace = true
agpeer-soulseek.workspace = true
agpeer-hook.workspace = true
agpeer-postprocess.workspace = true
clap.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
serde.workspace = true
serde_json.workspace = true
