[package]
name = "agpeer-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Axum HTTP API, SSE events, auth, and OpenAPI."

[features]
# Serves the Desktop UI (`apps/desktop/dist`) from the core as a single
# self-contained binary. Default off so plain `cargo build`/`cargo test` never
# require the frontend to have been built.
webui = ["dep:rust-embed"]

[dependencies]
agpeer-common.workspace = true
agpeer-storage.workspace = true
agpeer-core.workspace = true
agpeer-jobs.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower.workspace = true
tower-http.workspace = true
axum.workspace = true
futures.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
rust-embed = { version = "8", optional = true }

[dev-dependencies]
sqlx.workspace = true
